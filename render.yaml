services:
  - type: web
    name: huwstore-back
    runtime: node
    plan: free
    region: frankfurt
    # --include=dev force l'installation des devDependencies : NODE_ENV=production
    # (défini plus bas, actif aussi pendant le build) les exclurait sinon, et
    # tsc plus @types/* en dépendent pour compiler.
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: SHOP_ADMIN_EMAIL
        sync: false
      - key: SITE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
